<!DOCTYPE html>
<html>
<head>
    <title>Clearing Session Data...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f9fafb;
            color: #12262a;
        }
        .box {
            background: white;
            border: 1px solid #e5e9e8;
            border-radius: 18px;
            padding: 48px;
            text-align: center;
            max-width: 500px;
        }
        h1 {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 16px 0;
            text-transform: uppercase;
        }
        p {
            margin: 0 0 24px 0;
            color: #5c6d70;
            font-size: 14px;
        }
        .status {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #0c6771;
            background: #d2ffc8;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 24px;
        }
        a {
            display: inline-block;
            background: #12262a;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        a:hover {
            background: #1a3540;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Session Cleared</h1>
        <p>All drafts and activity history have been removed.</p>
        <div class="status" id="status">✓ localStorage cleared</div>
        <br>
        <a href="/">Return to Sapho Engage</a>
    </div>

    <script>
        // Clear all session data
        localStorage.removeItem('saphoEngage.v1.drafts');
        localStorage.removeItem('saphoEngage.v1.activities');

        // Show what was cleared
        const status = document.getElementById('status');
        status.textContent = '✓ All session data cleared';

        console.log('Session data cleared:');
        console.log('- saphoEngage.v1.drafts: removed');
        console.log('- saphoEngage.v1.activities: removed');
    </script>
</body>
</html>
