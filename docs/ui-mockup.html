<style>

    --ink:#e9efed; --muted:#93a5a3; --faint:#6f8180;
    --line:#243634; --line-strong:#324846;
    --accent:#37c3ca; --accent-2:#57dade; --accent-soft:#123234; --accent-ink:#9fe6ea;

    --skip-fg:#9aa6a6; --skip-bg:#1c2624; --skip-line:#2c3a38;

    --line:#243634; --line-strong:#324846;

    --warn-fg:#e8bb66; --warn-bg:#332810; --warn-line:#544220;
    --good-fg:#5cc88a; --good-bg:#12301f; --good-line:#1f4a31;
    --new-fg:#74dbe1; --new-bg:#0f2f31; --new-line:#1d4a4d;
    --skip-fg:#9aa6a6; --skip-bg:#1c2624; --skip-line:#2c3a38;

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ground); color:var(--ink);

  .mono{font-family:"IBM Plex Mono",monospace;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}

  /* ---- app shell ---- */
  header.top{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--surface) 88%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .topin{max-width:1080px; margin:0 auto; padding:12px clamp(14px,3vw,26px); display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:baseline; gap:8px; margin-right:auto;}
  .brand .logo{font-family:"Fraunces",serif; font-weight:600; font-size:21px; letter-spacing:-.01em;}
  .brand .logo b{color:var(--accent);}
  .brand .tag{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .seg{display:inline-flex; background:var(--surface-3); border:1px solid var(--line); border-radius:9px; padding:3px;}
  .seg button{border:none; background:none; color:var(--muted); font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:.15s;}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
  .gctl{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);}
  .gctl select{font-family:inherit; font-size:12.5px; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:7px; padding:5px 8px;}
  .hint{font-size:12px; color:var(--faint); border-left:2px solid var(--accent); padding-left:8px; margin-left:2px;}

  .subtabs{max-width:1080px; margin:0 auto; padding:0 clamp(14px,3vw,26px); display:flex; gap:2px;}
  .subtabs button{border:none; background:none; color:var(--muted); font-size:13.5px; font-weight:500; padding:11px 14px; border-bottom:2px solid transparent; transition:.15s;}
  .subtabs button[aria-pressed="true"]{color:var(--accent); border-bottom-color:var(--accent);}
  .subtabs .qbadge{font-family:"IBM Plex Mono",monospace; font-size:11px; background:var(--accent-soft); color:var(--accent-ink); border-radius:999px; padding:1px 7px; margin-left:6px;}

  main{max-width:1080px; margin:0 auto; padding:clamp(16px,3vw,26px) clamp(14px,3vw,26px) 90px;}
  .vhead{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .vtitle{font-family:"Fraunces",serif; font-weight:600; font-size:clamp(20px,3.4vw,26px); margin:0; letter-spacing:-.01em;}
  .vsub{font-size:13px; color:var(--muted); margin:3px 0 0;}
  .rowbtns{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:500; padding:7px 12px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; transition:.15s;}
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{filter:brightness(1.06); color:#fff;}
  .btn.ghost{border-color:transparent; color:var(--muted); padding:7px 9px;}
  .btn.ghost:hover{background:var(--surface-3); color:var(--ink);}

  /* ---- leaderboard ---- */
  ul.board{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px;}
  li.inf{background:var(--surface); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow-sm);
    display:grid; grid-template-columns:34px 40px 1fr auto; gap:14px; align-items:center; padding:13px 16px; transition:.15s; cursor:pointer;}
  li.inf:hover{border-color:var(--line-strong); box-shadow:var(--shadow); transform:translateY(-1px);}
  li.inf.pinned{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, var(--shadow-sm);}
  .rank{font-family:"Fraunces",serif; font-size:20px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums;}
  li.pinned .rank::after{content:"\1F4CC"; display:block; font-size:11px; margin-top:1px;}
  .av{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:600; font-size:14px; font-family:"IBM Plex Mono",monospace;}
  .who .nm{font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .who .rl{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .who .stat{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--faint); margin-top:5px; display:flex; gap:12px; flex-wrap:wrap;}
  .badge-new{font-family:"IBM Plex Mono",monospace; font-size:10.5px; background:var(--new-bg); color:var(--new-fg); border:1px solid var(--new-line); border-radius:999px; padding:1px 7px;}
  .right{display:flex; align-items:center; gap:16px;}
  .spark{width:74px; height:30px; display:block;}
  .score{text-align:right; min-width:74px;}
  .score .num{font-family:"Fraunces",serif; font-size:24px; font-variant-numeric:tabular-nums; line-height:1;}
  .score .lab{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);}
  .scorebar{height:5px; width:74px; background:var(--track); border-radius:999px; overflow:hidden; margin-top:5px;}
  .scorebar>span{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:999px;}
  .infacts{display:flex; gap:4px;}
  .iconbtn{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-size:13px; transition:.15s;}
  .iconbtn:hover{border-color:var(--accent); color:var(--accent);}
  .iconbtn[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent);}

  .candidate{background:repeating-linear-gradient(-45deg,var(--surface-2),var(--surface-2) 10px,var(--surface-3) 10px,var(--surface-3) 20px);
    border:1px dashed var(--line-strong); border-radius:13px; padding:13px 16px; display:grid; grid-template-columns:34px 40px 1fr auto; gap:14px; align-items:center; margin-top:2px;}
  .candidate .rank{font-size:13px;}
  .candidate .tagline{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--accent-ink); margin-top:4px;}
  .mutedbar{margin-top:12px; font-size:12.5px; color:var(--muted); text-align:center;}
  .mutedbar button{background:none; border:none; color:var(--accent); font-size:12.5px; text-decoration:underline; text-underline-offset:2px;}

  /* ---- workspace header ---- */
  .wshead{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-sm); padding:18px 20px; margin-bottom:16px;}
  .wstop{display:flex; gap:15px; align-items:center; flex-wrap:wrap;}
  .wstop .av{width:52px; height:52px; font-size:17px;}
  .wsname{font-family:"Fraunces",serif; font-weight:600; font-size:22px; line-height:1.1;}
  .wsrole{font-size:13px; color:var(--muted); margin-top:2px;}
  .wslink{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--accent); margin-top:4px; display:inline-block;}
  .wsscore{margin-left:auto; text-align:right;}
  .wsscore .num{font-family:"Fraunces",serif; font-size:34px; line-height:1; font-variant-numeric:tabular-nums;}
  .breakdown{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:16px; padding-top:15px; border-top:1px solid var(--line);}
  .metric .mlab{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
  .metric .mval{font-family:"IBM Plex Mono",monospace; font-size:13px; margin-top:2px; font-variant-numeric:tabular-nums;}
  .metric .mbar{height:4px; background:var(--track); border-radius:999px; overflow:hidden; margin-top:5px;}
  .metric .mbar>span{display:block; height:100%; background:var(--accent); border-radius:999px;}

  .windowctl{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .windowctl .lab{font-size:12.5px; color:var(--muted);}

  /* ---- post card ---- */
  .cards{display:flex; flex-direction:column; gap:14px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-sm); overflow:hidden;}
  .card.done{opacity:.62;}
  .cattr{display:flex; align-items:center; gap:10px; padding:13px 16px 0;}
  .cattr .av{width:32px; height:32px; font-size:12px;}
  .cattr .nm{font-weight:600; font-size:13.5px;}
  .cattr .meta{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--faint);}
  .chip{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.03em; padding:2px 9px; border-radius:999px; border:1px solid transparent; white-space:nowrap; margin-left:auto;}
  .chip.New{color:var(--new-fg); background:var(--new-bg); border-color:var(--new-line);}
  .chip.Drafted{color:var(--warn-fg); background:var(--warn-bg); border-color:var(--warn-line);}
  .chip.Posted{color:var(--good-fg); background:var(--good-bg); border-color:var(--good-line);}
  .chip.Skipped{color:var(--skip-fg); background:var(--skip-bg); border-color:var(--skip-line);}
  .ptext{padding:10px 16px 4px; font-size:14.5px;}
  .pmeta{padding:0 16px 13px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--faint); display:flex; gap:14px;}

  .draft{background:var(--surface-2); border-top:1px solid var(--line); padding:13px 16px;}
  .drafthead{display:flex; align-items:center; gap:10px; margin-bottom:9px; flex-wrap:wrap;}
  .draftlabel{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .draftlabel b{color:var(--accent); font-family:"IBM Plex Mono",monospace; font-weight:500;}
  .miniseg{display:inline-flex; background:var(--surface-3); border:1px solid var(--line); border-radius:8px; padding:2px;}
  .miniseg button{border:none; background:none; color:var(--muted); font-size:11.5px; padding:4px 9px; border-radius:6px; display:flex; align-items:center; gap:5px;}
  .miniseg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
  .drafttext{font-size:14px; line-height:1.55; padding:2px 0 4px;}
  textarea.editor{width:100%; font-family:inherit; font-size:14px; line-height:1.55; color:var(--ink); background:var(--surface); border:1px solid var(--accent); border-radius:8px; padding:9px 11px; resize:vertical; min-height:82px;}
  .grounded{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:8px;}
  .gtag{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--muted); background:var(--surface-3); border:1px solid var(--line); border-radius:6px; padding:1px 6px;}
  .review{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--warn-fg); background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:6px; padding:1px 7px;}
  .actions{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px;}
  .act{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:12px; font-weight:500; padding:6px 11px; border-radius:8px; display:inline-flex; align-items:center; gap:5px; transition:.15s;}
  .act:hover{border-color:var(--accent); color:var(--accent);}
  .act.post{background:var(--accent); border-color:var(--accent); color:#fff;} .act.post:hover{filter:brightness(1.07); color:#fff;}
  .act.skip{margin-left:auto; color:var(--muted);}

  .empty{text-align:center; color:var(--muted); padding:48px 20px; font-size:14px; background:var(--surface); border:1px dashed var(--line-strong); border-radius:14px;}

  /* toast */
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--ink); color:var(--ground); font-size:13px; padding:10px 16px; border-radius:10px; box-shadow:var(--shadow); z-index:50; transition:.22s; pointer-events:none; max-width:90vw;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:720px){
    li.inf{grid-template-columns:26px 36px 1fr; }
    li.inf .right{grid-column:1/-1; just-content:space-between; padding-top:6px; border-top:1px solid var(--line); margin-top:4px;}
    .candidate{grid-template-columns:26px 36px 1fr;}
    .breakdown{grid-template-columns:repeat(2,1fr);}
    .spark{display:none;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

const NO_CTA = new Set(["p18"]); // recall/negative context -> comment shown, DM disabled, needs review
const REVIEW = new Set(["p18","p17"]);

/* ---------------- state ---------------- */
const ps = {}; // per-post state
POSTS.forEach(p=>{ ps[p.id]={status:p.status, goal:document.getElementById("goalSel").value, variant:0, edited:null, editing:false}; });
const state = {mode:"influencer", tab:"influencers", view:"board", sel:null, win:"90", showMuted:false, candidate:CAND};

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const app=$("#app");
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function infById(id){return INF.find(x=>x.id===id);}
function color(id){const i=INF.findIndex(x=>x.id===id); return COL[(i>=0?i:0)%COL.length];}
function avatar(name,id,cls){return `<span class="av ${cls||''}" style="background:${color(id)}">${initials(name)}</span>`;}
function daysLabel(d){return d+"d";}
function sparkSVG(arr){const w=74,h=30,mx=Math.max(...arr),mn=Math.min(...arr),pad=3;
  const pts=arr.map((v,i)=>{const x=pad+i*((w-2*pad)/(arr.length-1)); const y=h-pad-((v-mn)/((mx-mn)||1))*(h-2*pad); return x.toFixed(1)+","+y.toFixed(1);}).join(" ");
  const last=pts.split(" ").pop().split(",");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.1" fill="var(--accent)"/></svg>`;}
function resolveDraft(p){const s=ps[p.id]; if(s.edited!=null) return s.edited; const arr=p.drafts[s.goal]||[""]; return arr[s.variant%arr.length]||arr[0]||"";}
function newCount(id){return POSTS.filter(p=>p.inf===id && ps[p.id].status==="New").length;}
function toast(msg){const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600);}

/* ---------------- render ---------------- */
function render(){
  // chrome
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===state.mode));
  const sub=$("#subtabs"); sub.hidden = state.mode!=="hybrid";
  if(state.mode==="hybrid"){
    document.querySelectorAll('#subtabs button').forEach(b=>b.setAttribute("aria-pressed", b.dataset.tab===state.tab));
    $("#qCount").textContent = POSTS.filter(p=>["New","Drafted"].includes(ps[p.id].status)).length;
  }
  // body
  if(state.view==="workspace"){ app.innerHTML=viewWorkspace(state.sel); return; }
  if(state.mode==="hybrid" && state.tab==="queue"){ app.innerHTML=viewQueue(); return; }
  app.innerHTML=viewBoard();
}

function viewBoard(){
  const active=INF.filter(x=>!x.muted);
  active.sort((a,b)=> (b.pinned-a.pinned) || (b.score-a.score));
  const mutedN=INF.filter(x=>x.muted).length;
  let rows=active.map((x)=>{
    const rank=x.pinned?"·":(INF.filter(y=>!y.muted).sort((a,b)=>b.score-a.score).findIndex(y=>y.id===x.id)+1);
    const nc=newCount(x.id);
    return `<li class="inf ${x.pinned?'pinned':''}" data-act="open" data-id="${x.id}" tabindex="0">
      <div class="rank">${x.pinned?'':rank}</div>
      ${avatar(x.name,x.id)}
      <div class="who">
        <div class="nm">${esc(x.name)} ${nc?`<span class="badge-new">${nc} new</span>`:''}</div>
        <div class="rl">${esc(x.role)}</div>
        <div class="stat"><span>${x.followers} followers</span><span>${x.cadence}</span><span>~${x.avgEng} avg eng</span><span>${x.relevance}% relevant</span></div>
      </div>
      <div class="right">
        ${sparkSVG(x.spark)}
        <div class="score"><div class="num">${x.score}</div><div class="lab">score</div><div class="scorebar"><span style="width:${x.score}%"></span></div></div>
        <div class="infacts">
          <button class="iconbtn" data-act="pin" data-id="${x.id}" aria-pressed="${x.pinned}" title="Pin to list" onclick="event.stopPropagation()">📌</button>
          <button class="iconbtn" data-act="mute" data-id="${x.id}" title="Mute / exclude" onclick="event.stopPropagation()">🔇</button>
        </div>
      </div></li>`;
  }).join("");

  const cand = state.candidate ? `<div class="candidate">
      <div class="rank mono">＋</div>
      ${avatar(state.candidate.name,'i7')}
      <div class="who"><div class="nm">${esc(state.candidate.name)}</div><div class="rl">${esc(state.candidate.role)}</div>
        <div class="tagline">↳ ${esc(state.candidate.why)}</div></div>
      <div class="rowbtns"><button class="btn primary" data-act="addcand">Add to list</button><button class="btn ghost" data-act="dropcand">Dismiss</button></div>
    </div>` : "";

  return `<div class="vhead">
      <div><h1 class="vtitle">Ranked influencers</h1><p class="vsub">Compounding pharmacy · scored on reach, cadence, resonance, relevance & recency. Pin or mute to override the algorithm.</p></div>
      <div class="rowbtns"><button class="btn" data-act="recompute">↻ Recompute ranking</button><button class="btn" data-act="fakeadd">＋ Add manually</button></div>
    </div>
    <ul class="board">${rows}</ul>
    ${cand}
    ${mutedN?`<div class="mutedbar">${mutedN} muted · <button data-act="togglemuted">${state.showMuted?'hide':'show'}</button></div>`:''}
    ${state.showMuted?renderMuted():''}`;
}
function renderMuted(){
  return `<ul class="board" style="margin-top:8px;opacity:.6">`+INF.filter(x=>x.muted).map(x=>`<li class="inf" style="cursor:default">
    <div class="rank">–</div>${avatar(x.name,x.id)}<div class="who"><div class="nm">${esc(x.name)}</div><div class="rl">${esc(x.role)}</div></div>
    <div class="right"><button class="btn ghost" data-act="unmute" data-id="${x.id}">Un-mute</button></div></li>`).join("")+`</ul>`;
}

function viewWorkspace(id){
  const x=infById(id);
  const back = state.mode==="hybrid" ? "Influencers" : "All influencers";
  const posts=POSTS.filter(p=>p.inf===id && (state.win==="all"||p.days<=Number(state.win)));
  const metrics=Object.entries(x.sub).map(([k,v])=>`<div class="metric"><div class="mlab">${k}</div><div class="mval">${v}</div><div class="mbar"><span style="width:${v}%"></span></div></div>`).join("");
  const cards = posts.length ? posts.map(postCard).join("") : `<div class="empty">No posts in this window. Try widening the date range.</div>`;
  return `<div class="rowbtns" style="margin-bottom:14px"><button class="btn ghost" data-act="back">← ${back}</button></div>
    <div class="wshead">
      <div class="wstop">${avatar(x.name,x.id)}
        <div><div class="wsname">${esc(x.name)}</div><div class="wsrole">${esc(x.role)}</div>
          <a class="wslink" data-act="noop">linkedin.com/in/${x.name.toLowerCase().replace(/[^a-z]+/g,'-').replace(/(^-|-$)/g,'')}</a></div>
        <div class="wsscore"><div class="num">${x.score}</div><div class="lab mono" style="font-size:9.5px;letter-spacing:.1em;color:var(--faint)">INFLUENCE SCORE</div>
          <div class="infacts" style="justify-content:flex-end;margin-top:6px">
            <button class="iconbtn" data-act="pin" data-id="${x.id}" aria-pressed="${x.pinned}" title="Pin">📌</button>
            <button class="iconbtn" data-act="mute" data-id="${x.id}" title="Mute">🔇</button></div></div>
      </div>
      <div class="breakdown">${metrics}</div>
    </div>
    <div class="windowctl"><span class="lab">Posts from</span>
      <div class="seg" role="group" aria-label="Time window">
        <button data-act="win" data-win="30" aria-pressed="${state.win==='30'}">Last 30d</button>
        <button data-act="win" data-win="90" aria-pressed="${state.win==='90'}">Last 90d</button>
        <button data-act="win" data-win="all" aria-pressed="${state.win==='all'}">All / last 10</button>
      </div>
      <span class="vsub" style="margin:0">${posts.length} post${posts.length!==1?'s':''}</span>
    </div>
    <div class="cards">${cards}</div>`;
}

function viewQueue(){
  const posts=POSTS.filter(p=>["New","Drafted"].includes(ps[p.id].status)).sort((a,b)=>a.days-b.days);
  const cards=posts.length?posts.map(p=>postCard(p,true)).join(""):`<div class="empty">Queue clear. Every post has been actioned.</div>`;
  return `<div class="vhead"><div><h1 class="vtitle">Response queue</h1>
    <p class="vsub">Every unactioned post across all influencers, newest first. Clear it like an inbox.</p></div>
    <div class="rowbtns"><button class="btn" data-act="recompute">↻ Refresh feed</button></div></div>
    <div class="cards">${cards}</div>`;
}

function postCard(p, showInf){
  const s=ps[p.id]; const x=infById(p.inf);
  const dmDisabled = NO_CTA.has(p.id);
  const goal = (s.goal==="dm" && dmDisabled) ? "comment" : s.goal;
  const draft = resolveDraft({...p, drafts:p.drafts}) || (goal==="dm"?"—":"");
  const done = ["Posted","Skipped"].includes(s.status);
  const attr = `<div class="cattr">${avatar(x.name,x.id)}
      <div><div class="nm">${esc(x.name)}</div><div class="meta">${x.role.split(' · ')[1]||''} · ${daysLabel(p.days)} · ${p.react}👍 ${p.comm}💬</div></div>
      <span class="chip ${s.status}">${s.status}</span></div>`;
  const editor = s.editing
    ? `<textarea class="editor" data-act="typing" data-post="${p.id}">${esc(draft)}</textarea>`
    : `<div class="drafttext">${goal==="dm"&&dmDisabled?'<span style="color:var(--muted)">DM disabled on recall / compliance-negative posts — public comment only.</span>':esc(draft)}</div>`;
  const grounded = `<div class="grounded"><span class="gtag">grounded: brand-voice</span><span class="gtag">primer</span><span class="gtag">facts</span>${REVIEW.has(p.id)?'<span class="review">⚑ needs human review</span>':''}</div>`;
  return `<div class="card ${done?'done':''}">
    ${attr}
    <div class="ptext">${esc(p.text)}</div>
    <div class="draft">
      <div class="drafthead">
        <span class="draftlabel">↳ Sapho draft <b>${goal==="comment"?"comment · engagement":"DM · lead-gen"}</b></span>
        <div class="miniseg" role="group" aria-label="Response type">
          <button data-act="goal" data-post="${p.id}" data-goal="comment" aria-pressed="${goal==='comment'}">Comment</button>
          <button data-act="goal" data-post="${p.id}" data-goal="dm" aria-pressed="${goal==='dm'}" ${dmDisabled?'disabled title="Disabled for this post" style="opacity:.4;cursor:not-allowed"':''}>DM</button>
        </div>
      </div>
      ${editor}
      ${grounded}
      <div class="actions">
        <button class="act" data-act="regen" data-post="${p.id}">↻ Regenerate</button>
        <button class="act" data-act="${s.editing?'doneedit':'edit'}" data-post="${p.id}">${s.editing?'✓ Done':'✎ Edit'}</button>
        <button class="act" data-act="copy" data-post="${p.id}">⧉ Copy</button>
        <button class="act post" data-act="post" data-post="${p.id}">${goal==='comment'?'Post ↗':'Send ↗'}</button>
        <button class="act skip" data-act="skip" data-post="${p.id}">Skip</button>
      </div>
    </div></div>`;
}

/* ---------------- events ---------------- */
document.getElementById("goalSel").addEventListener("change", e=>{
  Object.values(ps).forEach(s=>{ if(s.edited==null) s.goal=e.target.value; });
  render();
});
app.addEventListener("input", e=>{
  const t=e.target.closest('[data-act="typing"]'); if(!t) return;
  ps[t.dataset.post].edited = t.value;
});
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id, pid=el.dataset.post;
  switch(a){
    case "mode": state.mode=el.dataset.mode; state.view="board"; state.tab="influencers"; render(); break;
    case "tab": state.tab=el.dataset.tab; state.view="board"; render(); break;
    case "open": state.view="workspace"; state.sel=id; state.win="90"; render(); window.scrollTo(0,0); break;
    case "back": state.view="board"; render(); window.scrollTo(0,0); break;
    case "win": state.win=el.dataset.win; render(); break;
    case "pin": {const x=infById(id); x.pinned=!x.pinned; if(x.pinned)x.muted=false; toast(x.pinned?"Pinned — kept regardless of score":"Unpinned"); render(); break;}
    case "mute": {const x=infById(id); x.muted=true; x.pinned=false; if(state.view==="workspace"){state.view="board";} toast("Muted — removed from active list"); render(); break;}
    case "unmute": {infById(id).muted=false; toast("Restored"); render(); break;}
    case "togglemuted": state.showMuted=!state.showMuted; render(); break;
    case "recompute": toast("Re-ran discovery · scores updated · 1 new candidate surfaced"); if(!state.candidate)state.candidate=CAND; render(); break;
    case "addcand": toast("Added Dr. Hannah Voss — will re-score on next run"); state.candidate=null; render(); break;
    case "dropcand": toast("Dismissed — won't resurface this candidate"); state.candidate=null; render(); break;
    case "fakeadd": toast("In the build: paste a profile URL → discovery scores it → it joins the list"); break;
    case "goal": {const s=ps[pid]; s.goal=el.dataset.goal; s.variant=0; s.edited=null; render(); break;}
    case "regen": {const s=ps[pid]; s.edited=null; s.variant++; if(s.status==="New")s.status="Drafted"; toast("Regenerated"); render(); break;}
    case "edit": {ps[pid].editing=true; render(); break;}
    case "doneedit": {ps[pid].editing=false; if(ps[pid].status==="New")ps[pid].status="Drafted"; toast("Draft saved"); render(); break;}
    case "copy": toast("Copied to clipboard"); try{navigator.clipboard&&navigator.clipboard.writeText(resolveDraft(POSTS.find(p=>p.id===pid)));}catch(_){ } break;
    case "post": {ps[pid].status="Posted"; toast(ps[pid].goal==='dm'?"Logged as sent · opened profile":"Logged as posted · opened post"); render(); break;}
    case "skip": {ps[pid].status="Skipped"; ps[pid].editing=false; toast("Skipped"); render(); break;}
    case "noop": e.preventDefault(); break;
  }
});
app.addEventListener("keydown", e=>{
  if(e.key==="Enter"||e.key===" "){const li=e.target.closest('li.inf[data-act="open"]'); if(li){e.preventDefault(); state.view="workspace"; state.sel=li.dataset.id; state.win="90"; render(); window.scrollTo(0,0);}}
});

render();
</script>
